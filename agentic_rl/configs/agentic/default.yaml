batch_size: 32
n_samples: 16
lr: 1.0e-5
clip_epsilon: 0.2
max_tokens: 1024
max_rounds: 4
max_interactions: 3
max_grad_norm: 1.0
kl_coef: 0.04  # KL penalty coefficient (reference = frozen SFT snapshot, ref_* adapters)
max_steps: 200
save_freq: 20
eval_freq: 10
# 尺子精度（不是实验变量，是测量协议默认值，应对所有实验生效）：
# n=300 时单点 se=2.06 点、跨 run 差值 2·se≈5.8 点，而交互纠错在 acc≈0.85
# 处的收益上限只有 1.7 点——尺子比效应大三倍，导致“v3 到底超没超基线”
# 这类最基本的问题无法回答。改 1000（math_test 的 Level-5 共 1324 题，
# 仍全在测试集内，不碰训练集）后配末 5 点平均，2·se 降到 1.43 点。
# 代价：单次 eval 慢 3.3 倍。历史 n=300 数字由 train.py 的 acc300 切片对齐。
eval_samples: 1000
# RACA controller reward
ctrl_alpha: 0.3
ctrl_beta: 0.2
# Penalty per unused round when the final answer is wrong (mirrors ctrl_alpha's
# bonus when it is right). Early stopping pays off only when p(correct) exceeds
# gamma/(alpha+gamma) = 0.5 at these defaults. Raise to discourage stopping.
ctrl_gamma: 0.3
# ── RACA v2.3: 冷启动零成本交互（§18）──
# v2.2 首跑：p_t=1 层确定性 −0.07 压制在 16 步内把 int_rate 打穿，而自发 q
# 还没机会长起来。冷启动期发起与不发起在“没用”时期望相等（0 vs 0），
# 只在“有用”时为正（+gain·q）；站稳后课程式恢复成本逼选择性。
# ── v3.2：`sel≈0` 的第二个成因（第一个是 M1，见 prompt_templates.py）──
# Eq (13) 三项里，只有 int_overkill 是**条件在 p_primary 上**的：它只在“本来
# 就答对了还去问”时扣分，因此它是唯一能产生**选择性**压力的项。c_int 是平项，
# 对答对/答错一视同仁，只平移全局水平——把它调大只会把 int_rate 整体压塌
# （v2.2 实测 16 步打穿），调小只会让交互变廉价，两个方向都长不出选择性。
# 所以这次只开 int_overkill，c_int 刻意保持 0：要的是“答对时别问”的压力，
# 不是“少问”的压力。两个成因必须同时消除，缺一不可。
c_int: 0.0           # 交互固定成本（v2.1：0.02；v3.2 刻意保持 0，理由见上）
int_gain: 0.3        # 有效求助收益（错 → 对）
int_overkill: 0.05   # 画蛇添足惩罚（v2.1：0.05 → v3：0.0 → v3.2：0.05 复位）
# 不发起一律 0：v2.0 给“不发起+答对”+0.1 是无条件补贴，已证伪（§13）。
lambda_int: 1.0      # 交互奖励合成权重；0 = 消融B（有交互不训练交互，即 v1 行为）
max_hops: 2          # 每轮交互链响应跳数上限；0 = 消融A（完全禁用交互）
stop_gate: true      # stop 需黑板存在 verifier 分数；消融A 时建议关闭
# v3.1：闸门解锁。v2.0 的解锁通道只在“proposer 未自发起交互”分支里，被
# v3 的 int_rate=0.78 遮蔽 → gate 拦停 10→193 → 跑满轮数 → prompt 膨胀
# 致 step 151 崩（§20）。true = 想停但黑板无分数时，本轮末独立补一次
# verifier 打分（不占 hop 预算，不进 r_int 因果归因）。false = 消融。
gate_unlock: true
# v3 二测（§19，2026-08-20，sft_v3）：verifier 分辨力 Δ=+0.312 > 0.2 → 加权
# 投票解锁。但 v3 首跑 150 步实测证伪：15 次 eval 中 14 次 d_vote<0，均值
# −0.0126（符号检验 p≈0.001）。根因两层：① Δ 是全覆盖打分下测的，
# episode 内 verifier 覆盖率仅 ~32%，未验证答案的先验 0.5 低于“已验证的
# 错答案”，系统性压制未验证的正确答案；② parse 0.95→0.80 使长文本垃圾
# 答案各占一票，而 n×score 让“单票高分”能压过“多票中性”——weighted 比
# uniform 对污染更敏感。v3.1 已堵死②并用 gate_unlock 抬高覆盖率，待下轮
# d_vote 重新转正再评估重开。
vote_mode: uniform
# 修正正确率两次测量 ≤ 裸重采样（Δ=−0.062/−0.018）→ 修正票退出投票池，
# 仍进黑板供 r_int 因果信用与上下文；true = 消融（v2 行为）。
correction_in_vote: false
# 旧错解+批评上下文对下一轮重答有锚定伤害（通道②两次 Δ=−0.085/−0.055）
# → FLAW 不进 primary prompt（σ 推导与轮内修正链不受影响）；true = 消融。
flaw_in_primary_prompt: false
eps_force_init: 0.3  # 强制注入审查/验证的初始概率（冷启动保护，随 step 线性衰减）
# v2.3：ε 底数 0.05→0.25 基本不衰减——它不给发起决策梯度（forced 轮 r_int=0，
# 正确），但保证 critic/修正链与 q 测量始终有数据供给。
eps_force_min: 0.25
# 强制注入时选 verifier 的概率；v2.0 固定注 critic 导致 verifier 零训练数据，
# 而它恰好是 stop 闸门的看门人 → stop_rate 跟着塌。
eps_verifier_share: 0.5
# RACA variance threshold: groups whose reward std is <= this are treated as
# degenerate and dropped (they carry no comparative signal).
raca_delta: 1.0e-4
# Abort after this many consecutive batches that yield no gradient at all
# (guards against a livelock now that skipped batches don't consume a step).
max_consecutive_skips: 50
vllm_gpu_slot: 1
vllm_cuda_visible_devices: null
vllm_gpu_memory_utilization: 0.65
# V0/V1 引擎："0"=强制V0（默认，与训练机 vllm 0.9.2 一致）
# "1"=强制V1（vLLM ≥0.10 已删 V0，高版本镜像必须用）"auto"=交给 vLLM。
# 首次切 V1 用 SMOKE=1 作业验收：首步 kl 应 ≈0（策略=参考=SFT 起点），
# 不为 0 说明 V1 的 logprobs 返回与训练侧对齐有差异，不可直接用。
vllm_use_v1: "0"
# enforce_eager=true 禁用 CUDA graph（默认，与训练机历史行为一致）。
# V1 引擎把 piecewise CUDA graph 当核心优化，小 batch + 中等生成长度下
# kernel launch 开销占比高，设 false 开启 graph 可能大幅提速；代价是每个
# worker 额外几 GB 显存与首次建图耗时。改前后用 2 步 SMOKE 对比 t=耗时。
vllm_enforce_eager: true
vllm_num_workers: 3
vllm_max_model_len: 4096
vllm_start_timeout_s: 300
vllm_rpc_timeout_s: 1800
val_before_train: true
