batch_size: 32
n_samples: 16
lr: 1.0e-5
clip_epsilon: 0.2
max_tokens: 1024
max_rounds: 4
max_interactions: 3
max_grad_norm: 1.0
kl_coef: 0.04  # KL penalty coefficient (reference = frozen SFT snapshot, ref_* adapters)
max_steps: 200
save_freq: 20
eval_freq: 10
# 尺子精度（不是实验变量，是测量协议默认值，应对所有实验生效）：
# n=300 时单点 se=2.06 点、跨 run 差值 2·se≈5.8 点，而交互纠错在 acc≈0.85
# 处的收益上限只有 1.7 点——尺子比效应大三倍，导致“v3 到底超没超基线”
# 这类最基本的问题无法回答。改 1000（math_test 的 Level-5 共 1324 题，
# 仍全在测试集内，不碰训练集）后配末 5 点平均，2·se 降到 1.43 点。
# 代价：单次 eval 慢 3.3 倍。历史 n=300 数字由 train.py 的 acc300 切片对齐。
eval_samples: 1000
# RACA controller reward
ctrl_alpha: 0.3
ctrl_beta: 0.2
# Penalty per unused round when the final answer is wrong (mirrors ctrl_alpha's
# bonus when it is right). Early stopping pays off only when p(correct) exceeds
# gamma/(alpha+gamma) = 0.5 at these defaults. Raise to discourage stopping.
ctrl_gamma: 0.3
# ── RACA v2.3: 冷启动零成本交互（§18）──
# v2.2 首跑：p_t=1 层确定性 −0.07 压制在 16 步内把 int_rate 打穿，而自发 q
# 还没机会长起来。冷启动期发起与不发起在“没用”时期望相等（0 vs 0），
# 只在“有用”时为正（+gain·q）；站稳后课程式恢复成本逼选择性。
# ── v3.2：`sel≈0` 的第二个成因（第一个是 M1，见 prompt_templates.py）──
# Eq (13) 三项里，只有 int_overkill 是**条件在 p_primary 上**的：它只在“本来
# 就答对了还去问”时扣分，因此它是唯一能产生**选择性**压力的项。c_int 是平项，
# 对答对/答错一视同仁，只平移全局水平——把它调大只会把 int_rate 整体压塌
# （v2.2 实测 16 步打穿），调小只会让交互变廉价，两个方向都长不出选择性。
# 所以这次只开 int_overkill，c_int 刻意保持 0：要的是“答对时别问”的压力，
# 不是“少问”的压力。两个成因必须同时消除，缺一不可。
c_int: 0.0           # 交互固定成本（v2.1：0.02；v3.2 刻意保持 0，理由见上）
int_gain: 0.3        # 有效求助收益（错 → 对）
int_overkill: 0.05   # 画蛇添足惩罚（v2.1：0.05 → v3：0.0 → v3.2：0.05 复位）
# 「不发起+答对」一律 0：v2.0 给 +0.1 是无条件补贴，已证伪（§13）。penalty-only。
# ── v3.2 第十二轮：「不发起+答错」从 0 改为 −int_miss ─────────────────────
# 08-28 两跑（v32_m1 对照 / v32_open）实测：int_rate 从 step1 的 0.75 在 **40 步内
# 塌到 0.01**，之后 160 步不动；两跑一致，sel 始终 +0.01~+0.05、从未转负。
# 用实测 eff=q=0.12 复算边缘期望：
#     E[求助] = P(错)·q·gain − P(对)·overkill = 0.086·P(错) − 0.05
# 零点在 **P(错)=0.581**，而实际轮级答错率约 0.35~0.45 —— 零点落在工作区间**之外**，
# 且与 v2.0 同在一侧。所以"塌"不是训练不稳，是策略把这道题算对了。
# 而且原实现把它变成了**吸收态**：forced 轮在奖励函数里 r_int=0，本意是「决策
# 不是发起方做的，所以零梯度」，但 08-28 `v32_miss` 的 50 步实测将这句话推翻：
# int_rate 仅从 step10 的 0.73 延后到 step25 才塌到 0，eval step30/40/50 全为 0。
# 原因是 r_int 按 p_primary 分层 z-score，数值 0 仍参与排名；在首答错层里 forced
# 的 0 高于自发不求助的 −miss，而两者模型都实际输出 `action:none`，于是 forced
# 反而给 none 正优势。int_rate 越低，ε forced 占比越高，这个反向信号越强。
# 第十四轮修为 forced 的 r_int_w=None（通道缺席）：保留 r_prop、响应角色训练与
# q_forced 对照，但完全退出 int anchor group。**0 不等于无梯度，缺席才是。**
#
# 修法**不是**调 gain/overkill：那两个方向只把边缘期望整体推正 → 无差别求助 →
# v3 已实测（int_rate=0.78 而 sel≈0）。"全不问"和"全都问"两端都踩过了，问题不在
# 系数大小，而在**不作为没有定价**：求助犯的错（画蛇添足）有价，不求助犯的错
# （该问而没问）免费，于是从发起决策的视角看"错而不问"与"对而不问"完全等价。
# 注：r_prop=0 罚的是答案错，它对「问不问」没有区分度，给发起决策的梯度恒为 0，
# 所以这不是双重计罚——两者定价的是不同信道上的不同动作。
#
# 补上之后零点 = overkill/(q·gain + overkill + miss) = 0.05/(0.086+miss)：
#     miss=0.05 → 0.368      miss=0.10 → 0.269
# 取 **0.10** 是为了对未测量的 P(错) 保持稳健（现在只有从 acc 反推的 0.35~0.45；
# 同一轮已补 p_primary_rate 埋点，下一跑起可事后核准该不该改成 0.05 或 0.15）。
# 条件方向的 gap 同时从 0.036 放大到 0.136，而"对的时候问仍扣 overkill"不变
# —— **双向压力都在，不会塌向另一端。**
# 预期副作用（不是 bug）：保险式求助——自认为可能错时，求助即使救不回来（拿 0）也
# 优于不求助（拿 −0.10），所以 int_rate 会偏高且混入无效求助。由 eff 如实暴露
# （eff 低而 int_rate 高即是）。若过头，下一步抬 c_int 给求助加固定门槛，本轮不动。
# 0.0 = 消融（退回 v2.1 行为）；代码侧默认也是 0.0，必须在这里显式开启。
int_miss: 0.10
lambda_int: 1.0      # 交互奖励合成权重；0 = 消融B（有交互不训练交互，即 v1 行为）
# 每轮交互链响应跳数上限；0 = 消融A（完全禁用交互）。
# v3.2 第十轮 2 → 3。**2 不是"给少了"，是被机械硬触发吃满了**：标准路径
# proposer 出解 → hop1 critic 审查 → hop2 critic 标错硬触发 proposer 修正
# （`agentic_executor.py` 里写死 `target="proposer"`），正好两跳用光。而
# v3 实测 tgtC=0.75，即四分之三的轮次 proposer 选的就是 critic → verifier
# 一次都进不来 → 黑板没分数 → stop_gate 不许停 → step150 有 193 次 stop
# 被拦下。`gate_unlock` 那个补丁就是为这个死锁加的。
#
# **一条必须写清的限定**：第 3 跳（修正 → verifier）**没有机制把守**，它要求
# 修正后的 proposer 自己写出 `request verifier`。这个仓库已经在同一个坑里
# 栽过一次（v2.1：修正跳由未学会的行为把守 → correction_turns 几乎恒空 →
# q≈0 → int_rate 塌），所以才把 critic 那一跳改成机械触发。于是把预算加到 3
# 买到的只是**可能性**，不是保证。验收读数是 step 行的 `hop=1:x/2:y/3:z(3v=w)`：
# z 接近 0 就说明该照 critic 那条的样子把它也做成机械触发（行为改动，单独一步）。
#
# max_rounds 刻意不动（仍 4）：round 的成本是**乘的**（每多一轮黑板多一层，
# 后面所有 prompt 都变长），hop 的成本是**加的**（多一个 turn）；而 v3 step151
# 崩掉的直接原因正是"跑满 max_rounds → prompt 5036 > max_model_len 4096"。
max_hops: 3
stop_gate: true      # stop 需黑板存在 verifier 分数；消融A 时建议关闭
# v3.1：闸门解锁。v2.0 的解锁通道只在“proposer 未自发起交互”分支里，被
# v3 的 int_rate=0.78 遮蔽 → gate 拦停 10→193 → 跑满轮数 → prompt 膨胀
# 致 step 151 崩（§20）。true = 想停但黑板无分数时，本轮末独立补一次
# verifier 打分（不占 hop 预算，不进 r_int 因果归因）。false = 消融。
gate_unlock: true
# v3 二测（§19，2026-08-20，sft_v3）：verifier 分辨力 Δ=+0.312 > 0.2 → 加权
# 投票解锁。但 v3 首跑 150 步实测证伪：15 次 eval 中 14 次 d_vote<0，均值
# −0.0126（符号检验 p≈0.001）。根因两层：① Δ 是全覆盖打分下测的，
# episode 内 verifier 覆盖率仅 ~32%，未验证答案的先验 0.5 低于“已验证的
# 错答案”，系统性压制未验证的正确答案；② parse 0.95→0.80 使长文本垃圾
# 答案各占一票，而 n×score 让“单票高分”能压过“多票中性”——weighted 比
# uniform 对污染更敏感。v3.1 已堵死②并用 gate_unlock 抬高覆盖率，待下轮
# d_vote 重新转正再评估重开。
# ── 第十轮：**vote_mode 刻意仍保持 uniform**，三条理由 ────────────────────
# ① 它管的是 verifier 分数的权重，不在这一轮要打通的 critic 那条链上；
# ② 三个开关里它的反面证据最强（14/15 为负，符号检验 p≈0.001）；
# ③ 它是唯一**已经有免费反事实读数**的——`d_vote` 一直无条件在算（见
#    `agentic_executor` 四臂），不必真打开就知道该不该打开。
# 与下面两个开关的区别正在这里：那两个也有反事实读数了，但它们同时还影响
# 训练信号（`is_correct` → controller 奖励），所以要真开一次才知道策略能不能
# 学会用；vote_mode 是纯聚合，反事实读数就是它的全部答案。
vote_mode: uniform
# 修正正确率两次测量 ≤ 裸重采样（Δ=−0.062/−0.018）→ 修正票退出投票池，
# 仍进黑板供 r_int 因果信用与上下文；true = 消融（v2 行为）。
# ── 第十轮 false → true ──────────────────────────────────────────────────
# 上面那个 Δ 一个字不删，但它的**前提已经不成立了**：两次测量都是在 critic 意见
# 只送达 4% 的条件下做的（flaw 窗口 80、块没剥），proposer 拿到的是十来个字的
# 残句，"拿着反馈修不对"里有多少是"根本没拿到反馈"当时分不出来。第十轮把完整
# 送达率修到 96.3%（窗口 600 + 去重），所以这个负结论必须重测。
# 新增的判据（不必等 acc）：`fnl` 第四段 `unflip`（对→错）与第三段 `flip`
# （错→对）的差。v3 只有单向的 76，净效应为负只能推出反向 >76，具体多少查不到。
correction_in_vote: true
# 旧错解+批评上下文对下一轮重答有锚定伤害（通道②两次 Δ=−0.085/−0.055）
# → FLAW 不进 primary prompt（σ 推导与轮内修正链不受影响）；true = 消融。
# ── 第十轮 false → true ──────────────────────────────────────────────────
# 同上：那两次 Δ 也是在送达 4% 的条件下测的，"锚定伤害"与"读到半句被截断的
# 批评所以更糊涂"在当时的数据里无法区分。
# **这是本轮唯一只能靠 acc / sel 判定的改动**（另外五项各有专用仪表：d_corr、
# d_vote、hop 跳深、clip_prompt、fnl 四段），所以它是与 `v32_m1` 基线对比时
# 唯一的混淆项，判读结论时必须点出这一点。
flaw_in_primary_prompt: true
eps_force_init: 0.3  # 强制注入审查/验证的初始概率（冷启动保护，随 step 线性衰减）
# v2.3：ε 底数 0.05→0.25 基本不衰减，保证 critic/修正链与 q_forced 随机对照
# 始终有数据。原注释写“forced r_int=0，所以不给发起决策梯度”——**这句被
# v32_miss 的 50 步实测推翻**：0 进入分层 z-score 后仍有相对优势。第十四轮改为
# `r_int_w=None`、完全退出 int anchor group，才真正不给发起决策梯度。
eps_force_min: 0.25
# 强制注入时选 verifier 的概率；v2.0 固定注 critic 导致 verifier 零训练数据，
# 而它恰好是 stop 闸门的看门人 → stop_rate 跟着塌。
eps_verifier_share: 0.5
# RACA variance threshold: groups whose reward std is <= this are treated as
# degenerate and dropped (they carry no comparative signal).
raca_delta: 1.0e-4
# Abort after this many consecutive batches that yield no gradient at all
# (guards against a livelock now that skipped batches don't consume a step).
max_consecutive_skips: 50
vllm_gpu_slot: 1
vllm_cuda_visible_devices: null
vllm_gpu_memory_utilization: 0.65
# V0/V1 引擎："0"=强制V0（默认，与训练机 vllm 0.9.2 一致）
# "1"=强制V1（vLLM ≥0.10 已删 V0，高版本镜像必须用）"auto"=交给 vLLM。
# 首次切 V1 用 SMOKE=1 作业验收：首步 kl 应 ≈0（策略=参考=SFT 起点），
# 不为 0 说明 V1 的 logprobs 返回与训练侧对齐有差异，不可直接用。
vllm_use_v1: "0"
# enforce_eager=true 禁用 CUDA graph（默认，与训练机历史行为一致）。
# V1 引擎把 piecewise CUDA graph 当核心优化，小 batch + 中等生成长度下
# kernel launch 开销占比高，设 false 开启 graph 可能大幅提速；代价是每个
# worker 额外几 GB 显存与首次建图耗时。改前后用 2 步 SMOKE 对比 t=耗时。
vllm_enforce_eager: true
vllm_num_workers: 3
vllm_max_model_len: 4096
vllm_start_timeout_s: 300
vllm_rpc_timeout_s: 1800
val_before_train: true
