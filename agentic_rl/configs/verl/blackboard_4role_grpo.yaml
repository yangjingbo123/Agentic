# Blackboard 4-role multi-agent GRPO training on 2x H100 80GB
# Usage: bash scripts/train_verl_blackboard.sh

defaults:
  - _self_

data:
  train_files: data/math_train_rl.parquet
  val_files:   data/math_test_clean.parquet
  val_batch_size: 24
  max_val_batches: 5    # validate on 5 × 24 = 120 questions per eval
  prompt_key:  question
  max_prompt_length:  2048
  max_response_length: 1024
  train_batch_size: 24    # questions per step; total episodes = 24 * n=8 = 192; must be divisible by n_gpus=2
  shuffle: True
  filter_overlong_prompts: False
  truncation: left

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: /data/yangjingbo/models/Qwen3-8B
    enable_gradient_checkpointing: True
    use_remove_padding: False
    # ── multi-LoRA config ──────────────────────────────────────────
    lora_rank: 16
    lora_alpha: 32
    lora_target_modules: [q_proj, v_proj, k_proj, o_proj]
    lora_adapters: [controller, proposer, critic, verifier]

  actor:
    strategy: fsdp
    # ── turn-level GRPO (core algorithm) ──────────────────────────
    clip_mode: turn
    agg_mode: turn
    clip_ratio: 0.2
    clip_ratio_c: 3.0
    log_ratio_clip_c: 3.0
    entropy_coeff: 0.0
    use_kl_loss: True
    kl_loss_coef: 0.05
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    # ── batch sizes ───────────────────────────────────────────────
    ppo_mini_batch_size: 48    # = train_batch_size * n / ~(batch/gpu)
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 2
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 8192
    grad_clip: 1.0
    # ── optimizer ─────────────────────────────────────────────────
    optim:
      lr: 3.0e-6
      lr_warmup_steps_ratio: 0.05
      warmup_style: constant
      total_training_steps: -1
    fsdp_config:
      param_offload: False
      optimizer_offload: False
      fsdp_size: -1          # shard across all 2 GPUs
    ulysses_sequence_parallel_size: 1
    checkpoint:
      contents: ['model', 'hf_model', 'optimizer', 'extra']

  ref:
    fsdp_config:
      param_offload: True
      fsdp_size: -1
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: False
    log_prob_max_token_len_per_gpu: 16384
    ulysses_sequence_parallel_size: 1

  ref_model:
    path: ${actor_rollout_ref.model.path}
    override_config: {}
    enable_gradient_checkpointing: True
    use_remove_padding: False

  rollout:
    name: vllm_blackboard     # use the new blackboard rollout
    # ── sequence lengths ──────────────────────────────────────────
    prompt_length:   ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    max_num_turns: 4          # 4 roles × 1 round (fastest, ~2x speedup vs 8)
    # ── sampling ─────────────────────────────────────────────────
    n: 8                      # GRPO rollouts per question
    temperature: 1.0
    top_p: 1.0
    dtype: bfloat16
    # ── vLLM engine ───────────────────────────────────────────────
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.75   # 0.75×79=59 GB > FSDP(33)+vLLM_model(16)=49 GB, ~10 GB for KV cache
    enforce_eager: True            # skip CUDA graph compilation to save 10-15GB
    enable_chunked_prefill: True
    max_num_batched_tokens: 8192
    max_num_seqs: 256       # limit vLLM sampler warmup memory (default 1024 causes OOM)
    disable_log_stats: True
    enable_sleep_mode: True
    seed: 42
    # ── LoRA adapter paths (fill in after SFT) ────────────────────
    lora_rank: ${actor_rollout_ref.model.lora_rank}
    lora_adapter_paths:
      controller: checkpoints/sft/controller
      proposer:   checkpoints/sft/proposer
      critic:     checkpoints/sft/critic
      verifier:   checkpoints/sft/verifier
    # ── agent role config ─────────────────────────────────────────
    agent_roles: [controller, proposer, critic, verifier]
    system_prompts:
      controller: >
        你是数学推理团队的高层协调者。每轮分析当前黑板状态，决定本轮策略。
        输出格式（必须严格遵守）：
        <meta-plan>
        strategy: [explore|refine|verify|stop]
        focus: [proposer|critic|verifier|balanced]
        reason: [一句话说明]
        </meta-plan>
      proposer: >
        你是数学解题专家（Proposer）。生成推理链与候选答案。
        推理过程：[逐步推导]
        <answer>[数值]</answer>
      critic: >
        你是数学推理审查员（Critic）。找出逻辑或计算错误。
        错误分析：[有错误则使用<flaw>标签描述，无错误则写"无错误"]
      verifier: >
        你是答案验证专家（Verifier）。独立验证答案正确性并评分。
        <score>[0.0-1.0]</score>
        <answer>[你认为正确的答案]</answer>
    val_kwargs:
      temperature: 0.0
      top_p: 1.0
      n: 1
      do_sample: False
    # required by fsdp_rema_workers.compute_log_prob
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: False
    log_prob_max_token_len_per_gpu: 16384
critic:
  strategy: fsdp
  optim:
    lr: 1e-5
    total_training_steps: -1

reward_model:
  enable: False
  # reward_fn is loaded via custom_reward_function below
  mask_unfinished_reward: False
  primary_reward_role: proposer   # role whose reward is used for validation scoring

custom_reward_function:
  path: training/reward_fn_verl.py
  name: compute_reward

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    type: adaptive
    kl_coef: 0.05
    target_kl: 6.0
    horizon: 1000
  gamma_token_level: 1.0
  lam_token_level: 1.0
  gamma_turn_level: 1.0
  lam_turn_level: 1.0
  filter_groups:
    enable: True        # skip all-correct / all-wrong batches
    max_num_gen_batches: 4

trainer:
  balance_batch: True
  total_epochs: 10
  total_training_steps: 500
  project_name: agentic_rl_verl
  experiment_name: blackboard_4role_grpo_qwen3_8b
  logger: [console, wandb]
  val_generations_to_log_to_wandb: 8
  nnodes: 1
  n_gpus_per_node: 2
  save_freq: 50
  test_freq: 10
  val_before_train: False  # skip expensive initial validation before step 1
  critic_warmup: 0
  resume_mode: auto
  resume_from_path: False
  del_local_ckpt_after_load: False
  remove_previous_ckpt_in_save: True
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  default_hdfs_dir: null
