batch_size: 32
n_samples: 16
lr: 1.0e-5
clip_epsilon: 0.2
max_tokens: 1024
max_rounds: 4
max_interactions: 3
max_grad_norm: 1.0
kl_coef: 0.04  # KL penalty coefficient (reference = frozen SFT snapshot, ref_* adapters)
max_steps: 200
save_freq: 20
eval_freq: 10
eval_samples: 300
# RACA controller reward
ctrl_alpha: 0.3
ctrl_beta: 0.2
# Penalty per unused round when the final answer is wrong (mirrors ctrl_alpha's
# bonus when it is right). Early stopping pays off only when p(correct) exceeds
# gamma/(alpha+gamma) = 0.5 at these defaults. Raise to discourage stopping.
ctrl_gamma: 0.3
# ── RACA v2.3: 冷启动零成本交互（§18）──
# v2.2 首跑：p_t=1 层确定性 −0.07 压制在 16 步内把 int_rate 打穿，而自发 q
# 还没机会长起来。冷启动期发起与不发起在“没用”时期望相等（0 vs 0），
# 只在“有用”时为正（+gain·q）；站稳后课程式恢复成本逼选择性。
c_int: 0.0           # 交互固定成本（v2.1：0.02）
int_gain: 0.3        # 有效求助收益（错 → 对）
int_overkill: 0.0    # 画蛇添足惩罚（v2.1：0.05）
# 不发起一律 0：v2.0 给“不发起+答对”+0.1 是无条件补贴，已证伪（§13）。
lambda_int: 1.0      # 交互奖励合成权重；0 = 消融B（有交互不训练交互，即 v1 行为）
max_hops: 2          # 每轮交互链响应跳数上限；0 = 消融A（完全禁用交互）
stop_gate: true      # stop 需黑板存在 verifier 分数；消融A 时建议关闭
vote_mode: weighted  # v2.3：verifier 分数加权投票（§18 通道①）；uniform = 消融
eps_force_init: 0.3  # 强制注入审查/验证的初始概率（冷启动保护，随 step 线性衰减）
# v2.3：ε 底数 0.05→0.25 基本不衰减——它不给发起决策梯度（forced 轮 r_int=0，
# 正确），但保证 critic/修正链与 q 测量始终有数据供给。
eps_force_min: 0.25
# 强制注入时选 verifier 的概率；v2.0 固定注 critic 导致 verifier 零训练数据，
# 而它恰好是 stop 闸门的看门人 → stop_rate 跟着塌。
eps_verifier_share: 0.5
# RACA variance threshold: groups whose reward std is <= this are treated as
# degenerate and dropped (they carry no comparative signal).
raca_delta: 1.0e-4
# Abort after this many consecutive batches that yield no gradient at all
# (guards against a livelock now that skipped batches don't consume a step).
max_consecutive_skips: 50
vllm_gpu_slot: 1
vllm_cuda_visible_devices: null
vllm_gpu_memory_utilization: 0.65
vllm_num_workers: 3
vllm_max_model_len: 4096
vllm_start_timeout_s: 300
vllm_rpc_timeout_s: 1800
val_before_train: true
